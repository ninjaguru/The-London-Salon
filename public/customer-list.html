<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Submissions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #219ebc;
            --primary-light: #e0f2fe;
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
            color: var(--text-main);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            margin: 8px 0 0;
            color: var(--text-muted);
        }

        .btn {
            background-color: white;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background-color: var(--bg-color);
            border-color: #cbd5e1;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background-color: #126782;
            border-color: #126782;
        }

        .table-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f8fafc;
            padding: 16px 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f1f5f9;
        }

        .name-cell {
            font-weight: 600;
            color: var(--text-main);
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            background-color: var(--primary-light);
            color: var(--primary);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state h3 {
            margin: 0 0 10px;
            color: var(--text-main);
        }

        .actions {
            display: flex;
            gap: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>Customer Directory</h1>
            <p>A list of all customers who submitted their details.</p>
        </div>
        <div class="actions">
            <button onclick="clearData()" class="btn">Clear Data</button>
            <a href="customer-form.html" class="btn btn-primary">+ Add New</a>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Phone Number</th>
                    <th>Apartment Name</th>
                    <th>Submission Date</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data injected here -->
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBhBP-fOxGbDhML-uwdiogg64edbXa2GJ4",
        authDomain: "the-london-salon-ninja.firebaseapp.com",
        projectId: "the-london-salon-ninja",
        storageBucket: "the-london-salon-ninja.firebasestorage.app",
        messagingSenderId: "654274787986",
        appId: "1:654274787986:web:43f65b95defb139d1b044b",
        measurementId: "G-Z66KMYQ32X"
    };

    async function loadData() {
        const tableBody = document.getElementById('tableBody');
        let customers = [];
        
        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            const docSnap = await getDoc(doc(db, 'salon_vault', 'Submissions'));
            if (docSnap.exists()) {
                customers = docSnap.data().data || [];
            }
        } catch (error) {
            console.error("Firebase fetch failed:", error);
        }

        if (customers.length === 0) {
            customers = JSON.parse(localStorage.getItem('salon_customers_v7')) || [];
        }
        
        if (customers.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="4"><div class="empty-state"><h3>No submissions yet</h3></div></td></tr>';
            return;
        }

        customers.sort((a, b) => new Date(b.joinDate) - new Date(a.joinDate));

        tableBody.innerHTML = customers.map(c => `
            <tr>
                <td class="name-cell">${c.name}</td>
                <td>${c.phone}</td>
                <td><span class="badge">${c.apartment}</span></td>
                <td style="color: var(--text-muted); font-size: 13px;">
                    ${new Date(c.joinDate).toLocaleDateString()} ${new Date(c.joinDate).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                </td>
            </tr>
        `).join('');
    }

    window.clearData = async function() {
        if(confirm("Are you sure you want to delete ALL submissions from the cloud?")) {
            try {
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                await setDoc(doc(db, 'salon_vault', 'Submissions'), {
                    data: [],
                    updatedAt: new Date().toISOString(),
                    updatedBy: 'Customer-List-Clear'
                });
                localStorage.removeItem('salon_customers_v7');
                alert("All submissions cleared.");
                loadData();
            } catch (error) {
                alert("Failed to clear cloud data: " + error.message);
            }
        }
    };

    loadData();
</script>

</body>
</html>
